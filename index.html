<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./avatars/goku.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="screen-orientation" content="portrait" />
    <link rel="manifest" href="./manifest.json" />
    <title>UpLevel — Gamified AI Life Operating System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <script>
      // Automatically adapt asset paths on GitHub Pages (/phase-2/)
      (function() {
        const repoPrefix = '/phase-2';
        if (window.location.pathname.startsWith(repoPrefix)) {
          // Wrap Image src setter
          const origDesc = Object.getOwnPropertyDescriptor(Image.prototype, 'src');
          if (origDesc && origDesc.set) {
            Object.defineProperty(Image.prototype, 'src', {
              set: function(val) {
                if (typeof val === 'string' && val.startsWith('/') && !val.startsWith(repoPrefix)) {
                  val = repoPrefix + val;
                }
                origDesc.set.call(this, val);
              },
              get: function() {
                return origDesc.get.call(this);
              }
            });
          }
          // Wrap Audio constructor
          const OrigAudio = window.Audio;
          window.Audio = function(src) {
            if (typeof src === 'string' && src.startsWith('/') && !src.startsWith(repoPrefix)) {
              src = repoPrefix + src;
            }
            return new OrigAudio(src);
          };
          window.Audio.prototype = OrigAudio.prototype;
        }
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-white antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
